rules:
  cache-poisoning:
    # Test jobs consume their caches only to exercise ephemeral binaries. They do
    # not upload or publish artifacts, so no trusted release crosses this boundary.
    ignore:
      - run-tests.yml
  dangerous-triggers:
    # Documentation runs only after the trusted packaging workflow succeeds. It
    # checks out the default branch and never consumes the triggering run's code.
    ignore:
      - build-docs.yml
