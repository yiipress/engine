name: Mutation Tests

on:
  pull_request:
    paths: &mutation-paths
      - 'src/Content/Parser/**'
      - 'tests/Unit/Content/Parser/**'
      - 'composer.json'
      - 'composer.lock'
      - 'infection.json.dist'
      - 'phpunit.xml'
      - 'Makefile'
      - '.github/workflows/mutation.yml'
  push:
    branches:
      - master
    paths: *mutation-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install dependencies
        run: make -- composer install --no-progress --no-interaction
      - name: Run scoped mutation tests
        run: make infection
