name: Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-static
  COMPOSER_ROOT_VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: Linux static binary and PHAR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build Linux and PHAR artifacts
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./docker/Dockerfile
          target: package-static-artifacts
          outputs: type=local,dest=dist/linux-amd64
          cache-from: type=gha,scope=release-linux-amd64
          cache-to: type=gha,scope=release-linux-amd64,mode=max
          platforms: linux/amd64
          build-args: |
            COMPOSER_ROOT_VERSION=${{ github.ref_name }}

      - name: Smoke test Linux binary
        run: test "$(./dist/linux-amd64/yiipress --version)" = "YiiPress ${GITHUB_REF_NAME}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yiipress-linux-amd64
          path: dist/linux-amd64/yiipress
          if-no-files-found: error

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yiipress-phar
          path: dist/linux-amd64/yiipress.phar
          if-no-files-found: error

  windows:
    name: Windows static binary
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[impostor-commit]
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756


      - name: Build Windows artifact
        shell: pwsh
        run: build/package-windows.ps1 -DistDir dist/windows-amd64

      - name: Smoke test Windows binary
        shell: pwsh
        run: |
          if ((./dist/windows-amd64/yiipress.exe --version) -ne "YiiPress $env:GITHUB_REF_NAME") {
              throw "Packaged YiiPress version does not match $env:GITHUB_REF_NAME."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yiipress-windows-amd64
          path: dist/windows-amd64/yiipress.exe
          if-no-files-found: error

  macos:
    name: macOS static binary
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[impostor-commit]
        with:
          targets: aarch64-apple-darwin

      - name: Install macOS package dependencies
        run: |
          brew install autoconf automake bison re2c pkgconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build macOS artifact
        run: make package-macos PACKAGE_MACOS_ARCH=arm64 PACKAGE_MACOS_DIST=dist/macos-arm64 YIIPRESS_COMMIT=

      - name: Smoke test macOS binary
        run: ./dist/macos-arm64/yiipress --version | grep -Fqx "YiiPress ${GITHUB_REF_NAME}"

      - name: Pack macOS artifact
        run: tar -C dist/macos-arm64 -czf dist/yiipress-macos-arm64.tar.gz yiipress

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yiipress-macos-arm64
          path: dist/yiipress-macos-arm64.tar.gz
          if-no-files-found: error

  container:
    name: Binary-only distroless image
    needs:
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yiipress-linux-amd64
          path: dist/linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract distroless image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push binary-only distroless image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./docker/Dockerfile.distroless-binary
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  publish:
    name: Publish release
    needs:
      - linux
      - windows
      - macos
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release
          pattern: yiipress-*

      - name: Pack release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          tar -C release/yiipress-linux-amd64 -czf assets/yiipress-linux-amd64.tar.gz yiipress
          cp release/yiipress-macos-arm64/yiipress-macos-arm64.tar.gz assets/yiipress-macos-arm64.tar.gz
          zip -j assets/yiipress-windows-amd64.zip release/yiipress-windows-amd64/*
          cp release/yiipress-phar/yiipress.phar assets/yiipress.phar
          sha256sum assets/* > assets/SHA256SUMS

      - name: Generate release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*[!0-9.]*' "${tag}^" 2>/dev/null || true)"
          range="${tag}"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${tag}"
          fi

          release_author() {
            local name="$1"
            local email="$2"
            local nickname=""

            case "${email}" in
              *+*@users.noreply.github.com)
                nickname="${email#*+}"
                nickname="${nickname%@users.noreply.github.com}"
                ;;
              *@users.noreply.github.com)
                nickname="${email%@users.noreply.github.com}"
                ;;
              sam@rmcreative.ru)
                nickname="samdark"
                ;;
              pamparam83@gmail.com)
                nickname="pamparam83"
                ;;
              *)
                if [[ "${name}" != *" "* ]]; then
                  nickname="${name}"
                else
                  nickname="${email%@*}"
                fi
                ;;
            esac

            nickname="${nickname//[^[:alnum:]_.-]/-}"
            printf '@%s' "${nickname:-unknown}"
          }

          changes_file="$(mktemp)"
          while IFS=$'\t' read -r subject name email; do
            author="$(release_author "${name}" "${email}")"
            printf -- '- %s (%s)\n' "${subject}" "${author}" >> "${changes_file}"
          done < <(git log --format='%s%x09%an%x09%ae' "${range}")

          image="${REGISTRY}/${IMAGE_NAME}:${tag}"

          {
            printf '# %s\n\n' "${tag}"
            printf '## Artifacts\n\n'
            printf '%s\n' '- yiipress.phar'
            printf '%s\n' '- yiipress-linux-amd64.tar.gz'
            printf '%s\n' '- yiipress-macos-arm64.tar.gz'
            printf '%s\n' '- yiipress-windows-amd64.zip'
            printf -- '- %s\n\n' "${image}"
            printf '%s\n\n' 'Checksums are in SHA256SUMS.'
            printf '## Changes\n\n'
            if [ -n "${previous_tag}" ]; then
              printf 'Changes since %s:\n\n' "${previous_tag}"
            fi
            cat "${changes_file}"
          } > release-notes.md

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
